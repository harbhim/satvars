[workspace]
members = ["crates/*", "benchmarks"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/harbhim/satvars"
homepage = "https://github.com/harbhim/satvars"
rust-version = "1.85"
authors = ["Hardik Bhimani <hardikbhimani@rocketmail.com>"]
readme = "README.md"
keywords = ["etl", "pipeline", "csv", "parquet", "json"]

[workspace.dependencies]
arrow = "58"
parquet = "58"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
indexmap = "2"
satva-types = { version = "0.1.0", path = "crates/satva-types" }
satva-expr = { version = "0.1.0", path = "crates/satva-expr" }
satva-parser = { version = "0.1.0", path = "crates/satva-parser" }
satva-arrow = { version = "0.1.0", path = "crates/satva-arrow" }
satva-core = { version = "0.1.0", path = "crates/satva-core" }
satva-io = { version = "0.1.0", path = "crates/satva-io" }
satva-execution = { version = "0.1.0", path = "crates/satva-execution" }
satva-runner = { version = "0.1.0", path = "crates/satva-runner" }

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
manual_while_let_some = { level = "deny", priority = 4 }
pedantic = { level = "warn", priority = 3 }
must_use_candidate = { level = "allow", priority = 11 }
missing_errors_doc = { level = "allow", priority = 12 }
cast_precision_loss = { level = "allow", priority = 13 }
too_many_lines = { level = "allow", priority = 14 }
unused_self = { level = "allow", priority = 15 }

[profile.release]
debug = true
