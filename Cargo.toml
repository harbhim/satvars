[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
arrow = "58"
parquet = "58"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
indexmap = "2"

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
manual_while_let_some = { level = "deny", priority = 4 }
pedantic = { level = "warn", priority = 3 }
must_use_candidate = { level = "allow", priority = 11 }
missing_errors_doc = { level = "allow", priority = 12 }
cast_precision_loss = { level = "allow", priority = 13 }
too_many_lines = { level = "allow", priority = 14 }
unused_self = { level = "allow", priority = 15 }

[profile.release]
debug = true
