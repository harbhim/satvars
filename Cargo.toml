[workspace]
members = [
    "crates/satva-arrow",
    "crates/satva-cli",
    "crates/satva-core",
    "crates/satva-execution",
    "crates/satva-expr",
    "crates/satva-io",
    "crates/satva-python",
]
resolver = "2"

[workspace.dependencies]
arrow = "58"
parquet = "58"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
